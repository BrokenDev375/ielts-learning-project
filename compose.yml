name: ielts-learning-orm
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ielts_learning_orm}
      MYSQL_USER: ${MYSQL_USER:-ielts_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Create .env from .env.example first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Create .env from .env.example first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  server:
    build: ./source/server
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ielts_learning_orm}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=UTF-8
      SERVER_PORT: 8080
      DB_USERNAME: ${MYSQL_USER:-ielts_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_TEACHER_EMAIL: ${DEMO_TEACHER_EMAIL:-teacher@ielts.local}
      DEMO_TEACHER_PASSWORD: ${DEMO_TEACHER_PASSWORD:-}
      DEMO_STUDENT_EMAIL: ${DEMO_STUDENT_EMAIL:-student@ielts.local}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-}
      ASSET_DIRECTORY: /app/data/assets
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - asset_data:/app/data/assets
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  client:
    build: ./source/client
    ports:
      - "${APP_PORT:-5173}:8080"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql_data:
  asset_data:
